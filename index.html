<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>태그 선택자</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- tag selector -->
    <h1>css selector</h1>
    <p>paragraph</p>
    <!-- class selector -->
    <h2 class="menu1">h2 first</h2>
    <h2 class="menu2">h2 second</h2>
    <h2 class="menu3">h2 third</h2>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <!-- id selector -->
    <span id="title">오늘의 메뉴</span>
    <p id="title2">오늘의 할 일</p>
    <h3 id="subTitle" class="subTitle">하위 메뉴</h3>
    <!-- multi selector -->
    <h4>menu</h4>
    <p class="desc">Lorem ipsum dolor sit amet.</p>
    <span class="smallTitle">안녕하세요</span>
  </body>
</html>
